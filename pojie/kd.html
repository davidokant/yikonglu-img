<script>
(async()=>{
const EP=new URLSearchParams(location.search).get('ep');
const J=n=>fetch(`ep/${EP}/${n}.json`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`读不到 ep/${EP}/${n}.json`);return r.json()});
const [S,TM]=await Promise.all([J('spec'),J('tm')]);
// 说话的柯基：位置 ?dog=左,上,边长（像素，1080×1920 里），?dog=off 不放；默认右下角、大字区里头（避开各平台按钮和字幕区）
const DQ=new URLSearchParams(location.search).get('dog')||'',DOGON=DQ!='off',DP=(DQ&&DOGON?DQ:'724,1236,200').split(',').map(Number);
const DENV=DOGON?await dogEnv(`ep/${EP}/voice.wav`).catch(()=>null):null;
// 张嘴＝逐字时间给每个字一开一合，再乘这一刻的响度（字念得重嘴张得大）；没在念字就闭嘴
const WHO=new URLSearchParams(location.search).get('who')||S.who||'dog',AV=WHO=='youli'||WHO=='sg'?sgSVG:(typeof AVA!='undefined'&&AVA[WHO])||dogSVG;   // 说话的是谁：文案单 who 栏（dog 柯基、youli 上官有理、zhaojin、shouzhuo、luchuan、liuqi、shahela）
const DCH=TM.lines.flatMap(l=>l.ch||[]).filter(c=>c[2]>c[1]).sort((a,b)=>a[1]-b[1]);
const dogMouth=(t,f)=>{let c=null;for(const x of DCH){if(x[1]>t)break;if(t<x[2]+.03)c=x}if(!c)return 0;
  const d=Math.max(c[2]-c[1],.09),p=Math.min(1,(t-c[1])/d),sh=Math.sin(Math.PI*Math.min(1,p*1.1))**.7,ld=DENV?DENV[Math.min(f,DENV.length-1)]||0:.8;return sh*(.35+.65*ld)};
await Promise.all(['900 40px SC','700 40px SC','500 40px SC','900 40px Song','700 40px Song'].map(f=>document.fonts.load(f,'一孔录今问古答？')));
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const L={};TM.lines.forEach(l=>L[l.role]=l);const A=[],SFX=[],CHK=[],FX=[],CAS=[];
const EO='cubic-bezier(.16,1,.3,1)',BO='cubic-bezier(.34,1.56,.64,1)',EI='cubic-bezier(.5,0,.95,.5)';
let seed=11;const R=()=>{seed=seed*16807%2147483647;return seed/2147483647};

// ———— 一、照文案单生成五张卡 ————
const KEY=S.quote.key.map(g=>[...g]),CH=KEY.flat(),N=CH.length,G=KEY.length,COLS=Math.max(...KEY.map(g=>g.length)),GI=[],CI=[],GE=[];
KEY.forEach((g,gi)=>g.forEach((c,ci)=>{GI.push(gi);CI.push(ci);GE.push(ci==g.length-1)}));
const NUM=n=>n<=10?'零一二三四五六七八九十'[n]:n<20?'十'+'零一二三四五六七八九'[n-10]:String(n);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;'),hl=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
// 文案单里的小记号：开头“/”另起一行；开头“*”整块高亮；“*字*”块内高亮；“屏上字@口播里的字”＝屏上字和口播不一样时，指明它跟着口播里哪几个字出
const dsp=s=>{const i=s.indexOf('@');return i<0?s:s.slice(0,i)},cue=s=>{const i=s.indexOf('@');return i<0?s:s.slice(i+1)};
const ks=a=>a.map(s=>{s=dsp(s);let br='',y='';if(s[0]=='/'){br='<br>';s=s.slice(1)}if(s[0]=='*'&&s.indexOf('*',1)<0){y=' y';s=s.slice(1)}return `${br}<span class="k${y}">${hl(s)}</span>`}).join('');
const nl=a=>1+a.filter(s=>s[0]=='/').length,k1=s=>`<span class="k">${hl(dsp(s))}</span>`,opt=(v,h)=>v?h(esc(v)):'';
